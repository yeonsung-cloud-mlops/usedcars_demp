limit_req_zone $binary_remote_addr zone=predictions:1m rate=1r/s;
limit_req_zone $binary_remote_addr zone=metadata:1m rate=10r/s;
log_format minimal '$request_id $request_method $uri $status $request_time';
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    access_log /dev/stdout minimal;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    limit_req_status 429;
    error_page 429 = @limited;
    error_page 502 503 504 = @unavailable;
    error_page 413 = @too_large;
    location @limited {
        default_type application/json;
        add_header Retry-After 2 always;
        return 429 '{"error":{"code":"rate_limited","message":"요청이 많습니다. 잠시 후 다시 시도해 주세요."}}';
    }
    location @unavailable {
        default_type application/json;
        add_header Retry-After 3 always;
        return 503 '{"error":{"code":"unavailable","message":"예측 서비스를 준비 중입니다. 잠시 후 다시 시도해 주세요."}}';
    }
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"body_too_large","message":"요청 크기가 너무 큽니다."}}';
    }
    location = /api/v1/predict {
        limit_req zone=predictions burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /api/ {
        limit_req zone=metadata burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri.html $uri/ =404;
    }
}
