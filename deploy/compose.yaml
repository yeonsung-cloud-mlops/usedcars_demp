name: usedcar
services:
  api:
    image: usedcar-api:${RELEASE:-local}
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 1100m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: usedcar-web:${RELEASE:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - '80:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
