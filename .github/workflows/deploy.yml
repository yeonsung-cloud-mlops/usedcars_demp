name: Deploy main to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usedcar-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source without the training CSV
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Read deployment target
        id: target
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('deploy/cd/config.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"region={config['region']}\n")
              output.write(f"account={config['account_id']}\n")
              output.write(f"role=arn:aws:iam::{config['account_id']}:role/{config['github_role']}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements*.txt
            deploy/cd/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt -r deploy/cd/requirements.txt

      - name: Authenticate to AWS using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.target.outputs.role }}
          aws-region: ${{ steps.target.outputs.region }}
          allowed-account-ids: ${{ steps.target.outputs.account }}
          role-session-name: usedcar-${{ github.run_id }}

      - name: Restore checksum-verified model and fixtures
        run: python -m deploy.cd.model_artifact download

      - name: Test model, API, and deployment safeguards
        run: python -m pytest -q test_price_model.py backend/tests/test_api.py deploy/cd/tests

      - name: Install and build Next.js
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Build immutable images on the runner
        run: |
          docker build -f backend/Dockerfile -t "usedcar-api:$RELEASE" .
          docker build -f deploy/Dockerfile.web -t "usedcar-web:$RELEASE" .

      - name: Deploy with SSM and verify inference
        run: python -m deploy.cd.deploy --release "$RELEASE"

      - name: Record deployment result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          config = json.load(open('deploy/cd/config.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"배포 상태: **{os.environ['JOB_STATUS']}**\n\n")
              output.write(f"릴리스: `{os.environ['RELEASE']}`\n\n")
              output.write(f"[서비스 열기]({config['public_url']})\n")
          PY
